<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title description">
  <title id="title">What Happens Next? social avatar</title>
  <desc id="description">The series lead facing forward in a cream shirt and burgundy tie, with a plum question-mark bruise on one cheek.</desc>
  <defs>
    <radialGradient id="background" cx="53%" cy="35%" r="74%">
      <stop stop-color="#315052"/>
      <stop offset="1" stop-color="#111d24"/>
    </radialGradient>
    <radialGradient id="paper" cx="41%" cy="27%" r="82%">
      <stop stop-color="#f0d397"/>
      <stop offset=".67" stop-color="#d7a765"/>
      <stop offset="1" stop-color="#a76d53"/>
    </radialGradient>
    <clipPath id="portrait">
      <circle cx="512" cy="512" r="420"/>
    </clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".73" numOctaves="3" seed="21" stitchTiles="stitch"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="512" cy="512" r="446" fill="#182c30" stroke="#d4af72" stroke-width="9"/>
